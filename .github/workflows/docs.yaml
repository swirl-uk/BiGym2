name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "bigym/loco/**"
      - "bigym/vr/collect/**"
      - ".github/workflows/docs.yaml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "docs/**"
      - "bigym/loco/**"
      - "bigym/vr/collect/**"
      - ".github/workflows/docs.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # Core deps + the `docs` dependency group are enough: mujoco imports
      # headlessly without a GL context.
      - name: Build docs
        run: |
          uv sync --group docs
          uv run --no-sync sphinx-build -b html -W docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Only main deploys; GitHub Pages needs a public repository on a free plan.
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
