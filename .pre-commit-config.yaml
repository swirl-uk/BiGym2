# bigym/envs/xmls/g1/*.xml are excluded from the whitespace and xmllint
# formatters, so the robot model stays as vendored.
# bigym/loco/adapters/_groot/ is vendored NVIDIA code kept byte-identical
# to upstream where possible (see its PROVENANCE.md), so no formatter touches it.
# typings/mujoco/ is generated by typings/generate_mujoco_stubs.sh.
exclude: ^(bigym/envs/xmls/g1/.*\.xml|bigym/loco/adapters/_groot/.*|typings/mujoco/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: sort-simple-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-xml

  # Lint and format settings live in pyproject.toml ([tool.ruff]).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/lsst-ts/pre-commit-xmllint
    rev: v1.0.0
    hooks:
      - id: format-xmllint
