# Allowlist egress proxy for the agent containers.
#
# The agent container joins an internal docker network with no route off the
# host; the only thing reachable on it is this proxy, which resolves and
# forwards exactly the hosts in its filter file and refuses everything else
# (FilterDefaultDeny). That is what keeps a session's network access to its own
# model endpoint: package indexes, code hosts and search engines are not on any
# allowlist, so an agent cannot fetch code or look the environment up.
#
# One allowlist ships for all harnesses (proxy/filter), mounted at
# /etc/tinyproxy/filter by `bigym-agent run` (or by hand, see README.md).

User nobody
Group nobody
Port 8888
Timeout 600
LogLevel Info
MaxClients 200
DisableViaHeader Yes
# Reachable only from the internal network the agent containers are on.
Allow 0.0.0.0/0
# CONNECT (HTTPS) to 443 only.
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No
