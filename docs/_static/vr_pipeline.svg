<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Virgil','Segoe Print','Comic Sans MS','Chalkboard SE',cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#1e1e1e" stroke-width="1.7" stroke-linecap="round"/>
    </marker>
  </defs>
  <!-- ============ headset ============ -->
  <g filter="url(#rough)">
    <rect x="24" y="196" width="164" height="104" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="106" y="238" text-anchor="middle" font-size="15.5" fill="#1e1e1e" font-weight="bold">VR headset +</text>
  <text x="106" y="258" text-anchor="middle" font-size="15.5" fill="#1e1e1e" font-weight="bold">controllers</text>
  <text x="106" y="281" text-anchor="middle" font-size="12" fill="#6c6c6c">OpenXR &#xB7; WiVRn</text>
  <!-- ============ three channels ============ -->
  <!-- sticks -->
  <g filter="url(#rough)">
    <path d="M 190 216 C 230 190, 240 130, 268 106" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <text x="212" y="140" font-size="12.5" fill="#6c6c6c" transform="rotate(-38 216 148)">sticks</text>
  <g filter="url(#rough)">
    <rect x="276" y="52" width="252" height="96" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="402" y="84" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="bold">locomotion command</text>
  <text x="402" y="105" text-anchor="middle" font-size="13.5" fill="#1e1e1e">[vx, vy, wz, height]</text>
  <text x="402" y="128" text-anchor="middle" font-size="11.5" fill="#5f5f8f">clamped to command_spec training ranges</text>
  <!-- hand poses -->
  <g filter="url(#rough)">
    <path d="M 190 248 L 268 248" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <text x="228" y="240" text-anchor="middle" font-size="12.5" fill="#6c6c6c">6D poses</text>
  <g filter="url(#rough)">
    <rect x="276" y="204" width="252" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="402" y="236" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="bold">mink QP differential IK</text>
  <text x="402" y="257" text-anchor="middle" font-size="13.5" fill="#1e1e1e">= arm joint targets</text>
  <text x="402" y="279" text-anchor="middle" font-size="11.5" fill="#4f7f5f">zero-jump engage &#xB7; ~0.3 ms/solve</text>
  <!-- triggers -->
  <g filter="url(#rough)">
    <path d="M 190 282 C 230 306, 240 364, 268 388" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <text x="204" y="356" font-size="12.5" fill="#6c6c6c" transform="rotate(38 208 348)">triggers / grips</text>
  <g filter="url(#rough)">
    <rect x="276" y="352" width="252" height="82" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="402" y="386" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="bold">grippers</text>
  <text x="402" y="410" text-anchor="middle" font-size="11.5" fill="#8f5f5f">Dex3: discrete grasp presets</text>
  <!-- ============ converge to outer action ============ -->
  <g filter="url(#rough)">
    <path d="M 528 100 C 570 110, 580 180, 600 214" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M 528 249 L 596 249" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M 528 393 C 570 384, 580 314, 600 282" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#rough)">
    <rect x="606" y="196" width="160" height="104" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="686" y="230" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="bold">outer action</text>
  <text x="686" y="252" text-anchor="middle" font-size="12" fill="#1e1e1e">[base cmd | arms |</text>
  <text x="686" y="269" text-anchor="middle" font-size="12" fill="#1e1e1e">grippers]</text>
  <!-- ============ env.step ============ -->
  <g filter="url(#rough)">
    <path d="M 766 248 L 812 248" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#rough)">
    <rect x="820" y="188" width="140" height="120" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="890" y="220" text-anchor="middle" font-size="15" fill="#1e1e1e" font-weight="bold">env.step()</text>
  <text x="890" y="243" text-anchor="middle" font-size="11.5" fill="#6c6c6c">frozen RL lower</text>
  <text x="890" y="259" text-anchor="middle" font-size="11.5" fill="#6c6c6c">body balances +</text>
  <text x="890" y="275" text-anchor="middle" font-size="11.5" fill="#6c6c6c">walks inside</text>
  <!-- ============ episode output ============ -->
  <g filter="url(#rough)">
    <path d="M 890 308 L 890 366" fill="none" stroke="#1e1e1e" stroke-width="1.7" marker-end="url(#arrow)"/>
  </g>
  <g filter="url(#rough)">
    <rect x="800" y="374" width="164" height="72" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.8"/>
  </g>
  <text x="882" y="404" text-anchor="middle" font-size="14.5" fill="#1e1e1e" font-weight="bold">npz episode</text>
  <text x="882" y="426" text-anchor="middle" font-size="12" fill="#6c6c6c">demo schema v1</text>
  <!-- ============ engage snapshot callout ============ -->
  <g filter="url(#rough)">
    <rect x="570" y="366" width="200" height="88" rx="10" fill="none" stroke="#e8590c" stroke-width="1.7" stroke-dasharray="7 5"/>
    <path d="M 772 400 C 796 396, 800 330, 830 312" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <text x="670" y="390" text-anchor="middle" font-size="13" fill="#e8590c" font-weight="bold">engage snapshot</text>
  <text x="670" y="410" text-anchor="middle" font-size="11" fill="#e8590c">qpos &#xB7; qvel &#xB7; ctrl &#xB7; warmstart</text>
  <text x="670" y="426" text-anchor="middle" font-size="11" fill="#e8590c">+ controller state</text>
  <text x="670" y="444" text-anchor="middle" font-size="10.5" fill="#e8590c">enables bit-exact replay</text>
</svg>
